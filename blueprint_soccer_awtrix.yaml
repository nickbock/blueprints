blueprint:
  name: "AWTRIX NG - Soccer Team Scoreboard"
  author: Tevoll
  description: >
    # Soccer Team Scoreboard for AWTRIX NG

    Draws a live scoreboard for a TeamTracker soccer sensor on an AWTRIX NG
    matrix: both team colours, the score, and a period indicator along the
    bottom row.

    The period indicator follows the ESPN period TeamTracker exposes as the
    `quarter` attribute - 1 = first half, 2 = second half, 3 and 4 = the two
    extra-time halves, 5 = penalty shootout:

    - First half - left dash lit, right dash dim
    - Second half - both dashes lit
    - Extra time 1 - four pips, the last one dim
    - Extra time 2 - four pips, all lit
    - Penalties - four pips lit and an amber divider

    During a shootout TeamTracker reports the score as `1(4)`. The board then
    shows the shootout tally rather than the goals, which are level by
    definition; the amber divider marks that you are reading penalties.

    Requires AWTRIX NG firmware with MQTT + Home Assistant discovery enabled.
    For the older AWTRIX 3 / AWTRIX Light firmware, use the previous revision
    of this blueprint - the MQTT topics and payload format are not compatible.

  domain: automation

  homeassistant:
    min_version: "2024.11.0"

  input:
    awtrix:
      name: AWTRIX NG
      description: >-
        Select the AWTRIX NG device(s) to draw the scoreboard on.
      selector:
        device:
          filter:
            - integration: mqtt
              manufacturer: Blueforcer
              model: AWTRIX NG
          multiple: true

    appname:
      name: Awtrix Application name
      description: >-
        This is the app name used in the MQTT topic - it should be unique.
        AWTRIX NG requires it to match [A-Za-z0-9_-], 1-32 characters.
      default: "soccerteamscore"
      selector:
        text:

    message_duration:
      name: Message Duration ⏱️
      description: >-
        How long should the message remain on the screen (in seconds).
      selector:
        number:
          min: 0
          max: 300
          unit_of_measurement: "sec"
      default: 15

    my_sensor:
      name: Soccer Sensor
      description: Select your Soccer Team Sensor
      selector:
        entity:
          filter:
            - integration: teamtracker

  source_url: https://github.com/nickbock/blueprints/blob/main/blueprint_soccer_awtrix.yaml

variables:
  device_ids: !input awtrix
  # AWTRIX NG publishes its own topic prefix to a "MQTT prefix" sensor.
  # Resolve each picked device to that prefix; every topic below hangs off it.
  devices: >-
    {% macro get_device(device_id) %}
      {% set e = device_entities(device_id) | select('search', 'mqtt_prefix') | list %}
      {{ states(e[0]) if e else 'unknown' }}
    {% endmacro %}
    {% set ns = namespace(devices=[]) %}
    {% for device_id in device_ids %}
      {% set device=get_device(device_id)|replace(' ','')|replace('\n','') %}
      {% set ns.devices = ns.devices + [ device ] %}
    {% endfor %}
    {{ ns.devices | reject('match','unavailable|unknown') | list }}
  appname: !input appname
  my_sensor: !input my_sensor
  message_duration: !input message_duration

  # NG validates the whole payload: one unreadable colour rejects everything,
  # so fall back to plain white/black when the sensor has no colours yet.
  team_colors: "{{ state_attr(my_sensor, 'team_colors') or ['#FFFFFF', '#000000'] }}"
  opponent_colors: "{{ state_attr(my_sensor, 'opponent_colors') or ['#FFFFFF', '#000000'] }}"
  team_colors_0: "{{ team_colors[0] }}"
  team_colors_1: "{{ team_colors[1] }}"
  opponent_colors_0: "{{ opponent_colors[0] }}"
  opponent_colors_1: "{{ opponent_colors[1] }}"

  # ESPN period, via TeamTracker's "quarter" attribute:
  # 1 = first half, 2 = second half, 3/4 = extra time, 5 = penalties.
  period: "{{ state_attr(my_sensor, 'quarter') | int(0) }}"

  # TeamTracker writes "1(4)" once a shootout starts - goals, then the
  # shootout tally. Show the tally when there is one; the goals are level.
  # These stay plain numbers: HA parses a rendered "00" back to the integer
  # 0, so the zero-padding has to happen inside the payload template below,
  # where it is serialised straight to JSON and never round-trips.
  team_score: >-
    {% set raw = state_attr(my_sensor, 'team_score') | string %}
    {% set goals = raw.split('(')[0] | int(0) %}
    {% set pens = raw.split('(')[1] | replace(')', '') | int(-1) if '(' in raw else -1 %}
    {{ pens if pens >= 0 else goals }}
  opponent_score: >-
    {% set raw = state_attr(my_sensor, 'opponent_score') | string %}
    {% set goals = raw.split('(')[0] | int(0) %}
    {% set pens = raw.split('(')[1] | replace(')', '') | int(-1) if '(' in raw else -1 %}
    {{ pens if pens >= 0 else goals }}

  # Bottom-row period indicator, appended after the base drawing. Row 7 is
  # clear of the scores (rows 1-6), and the penalties case redraws the
  # divider in amber - later draw commands win.
  period_marker: >-
    {% if period >= 5 %}
      {{ [["pixels", "#FFFFFF", 12, 7, 14, 7, 17, 7, 19, 7],
          ["line", 14, 3, 17, 3, "#FFAA00"]] }}
    {% elif period == 4 %}
      {{ [["pixels", "#FFFFFF", 12, 7, 14, 7, 17, 7, 19, 7]] }}
    {% elif period == 3 %}
      {{ [["pixels", "#FFFFFF", 12, 7, 14, 7, 17, 7],
          ["pixel", 19, 7, "#919191"]] }}
    {% elif period == 2 %}
      {{ [["line", 12, 7, 13, 7, "#FFFFFF"],
          ["line", 18, 7, 19, 7, "#FFFFFF"]] }}
    {% else %}
      {{ [["line", 12, 7, 13, 7, "#FFFFFF"],
          ["line", 18, 7, 19, 7, "#919191"]] }}
    {% endif %}

  # Built as a real structure and serialised with to_json, so the payload is
  # valid by construction - NG rejects a malformed body whole.
  payload_scoreboard: >-
    {{ {
         "draw": [
           ["rectFill",  0, 0, 16, 8, team_colors_0 | string],
           ["rectFill", 16, 0, 16, 8, opponent_colors_0 | string],
           ["line",  1, 0,  1, 7, team_colors_1 | string],
           ["line",  3, 0,  3, 7, team_colors_1 | string],
           ["line", 28, 0, 28, 7, opponent_colors_1 | string],
           ["line", 30, 0, 30, 7, opponent_colors_1 | string],
           ["text",  5, 1, "%02d" | format(team_score | int(0)), "#FFFFFF"],
           ["text", 20, 1, "%02d" | format(opponent_score | int(0)), "#FFFFFF"],
           ["line", 14, 3, 17, 3, "#FFFFFF"]
         ] + period_marker,
         "durationMs": (message_duration | int) * 1000
       } | to_json }}
  payload_switch: '{{ {"name": appname | string} | to_json }}'

triggers:
  - trigger: state
    entity_id:
      - !input my_sensor
    to: IN
    id: Game Start
  - trigger: state
    entity_id:
      - !input my_sensor
    to: POST
    for:
      hours: 0
      minutes: 5
      seconds: 0
    id: Game End
  - trigger: state
    entity_id:
      - !input my_sensor
    attribute: team_score
    id: Team Score Change
  - trigger: state
    entity_id:
      - !input my_sensor
    attribute: opponent_score
    id: Opponent Score Change
  - trigger: state
    entity_id:
      - !input my_sensor
    attribute: quarter
    id: Period Change

conditions: []
actions:
  - choose:
      # Five minutes after the game goes final, drop the app again.
      - conditions:
          - condition: trigger
            id:
              - Game End
        sequence:
          - repeat:
              for_each: "{{ devices }}"
              sequence:
                # An empty payload on the pushed-app topic deletes the app.
                - action: mqtt.publish
                  data:
                    qos: 0
                    retain: false
                    topic: "{{ repeat.item }}/cmd/apps/pushed/{{ appname }}"
                    payload: ""
    default:
      - repeat:
          for_each: "{{ devices }}"
          sequence:
            - action: mqtt.publish
              data:
                qos: 0
                retain: false
                topic: "{{ repeat.item }}/cmd/apps/pushed/{{ appname }}"
                payload: "{{ payload_scoreboard }}"
            # Kick-off and goals jump the loop to the scoreboard; a plain
            # period change only redraws it in place.
            - if:
                - condition: trigger
                  id:
                    - Game Start
                    - Team Score Change
                    - Opponent Score Change
              then:
                - action: mqtt.publish
                  data:
                    qos: 0
                    retain: false
                    topic: "{{ repeat.item }}/cmd/apps/switch"
                    payload: "{{ payload_switch }}"
mode: restart
